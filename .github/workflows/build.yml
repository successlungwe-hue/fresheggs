name: Build FreshEggs (.exe and .apk)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --name FreshEggs --icon icon.ico --add-data "templates;templates" --add-data "static;static" desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: FreshEggs-windows-exe
          path: dist/FreshEggs.exe

  android-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev build-essential ccache
      - name: Install Buildozer
        run: pip install --upgrade pip buildozer cython virtualenv setuptools
      - name: Build APK
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: FreshEggs-android-apk
          path: bin/*.apk
